name: Medusa CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug — Python version and path
        run: |
          python --version
          python -c "import sys; print('sys.path:', sys.path[:3])"
          echo "PWD: $(pwd)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r medusa/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify package imports
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -c "
          import medusa.core.state, medusa.core.agent_graph, medusa.core.supervisor, medusa.core.error_handler
          import medusa.core.blue.config, medusa.core.blue.knowledge_graph, medusa.core.blue.ai_engine
          import medusa.tools.guardrails, medusa.tools.workspace, medusa.core.blue.errors
          import medusa.core.config_models, medusa.core.constants, medusa.core.paths
          print('All imports OK')
          "

      - name: Run tests with coverage
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -m pytest medusa/tests/ \
            -v --tb=short \
            --cov=medusa --cov-report=term-missing --cov-report=xml \
            -m "not ai" \
            -p no:warnings

      - name: Type check (pyright)
        continue-on-error: true
        run: |
          pip install pyright && pyright medusa/ || true

      - name: Lint check (non-blocking)
        continue-on-error: true
        run: |
          pip install ruff && ruff check medusa/ || true

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit && pip-audit || true

  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Lint (oxlint)
        run: bun run lint

      - name: Typecheck (all packages)
        run: bun run typecheck
