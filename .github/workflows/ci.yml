name: Suijin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug — Python version and path
        run: |
          python --version
          python -c "import sys; print('sys.path:', sys.path[:3])"
          echo "PWD: $(pwd)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r suijin/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify package imports
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -c "
          import suijin.modules.agent.lib.state, suijin.modules.agent.lib.agent_graph, suijin.modules.agent.lib.supervisor, suijin.modules.platform.lib.error_handler
          import suijin.core.blue.config, suijin.core.blue.knowledge_graph, suijin.core.blue.ai_engine
          import suijin.modules.tools.lib.guardrails, suijin.modules.platform.lib.workspace, suijin.core.blue.errors
          import suijin.modules.platform.lib.config_models, suijin.modules.platform.lib.constants
          print('All imports OK')
          "

      - name: Run tests with coverage
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -m pytest suijin/tests/ \
            -v --tb=short \
            --cov=suijin --cov-report=term-missing --cov-report=xml \
            -m "not ai" \
            -p no:warnings

      - name: Type check (non-blocking)
        continue-on-error: true
        run: |
          pip install pyright && pyright suijin/

      - name: Lint check
        run: |
          pip install ruff && ruff check suijin/

      - name: Architecture boundaries (kernel purity + module boundaries)
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -m pytest suijin/tests/kernel/test_kernel_purity.py \
            suijin/tests/kernel/test_phase5_boundary.py \
            suijin/tests/kernel/test_audit_regressions.py -q

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit && pip-audit

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd webui
          npm ci --no-audit --no-fund
          npm run build

      - name: Committed bundle must be fresh
        run: |
          # The build just regenerated suijin/ui/dist. If git sees changes,
          # the committed bundle is stale — rebuild locally and commit it.
          if ! git diff --quiet -- suijin/ui/dist; then
            echo "::error::suijin/ui/dist is stale — run: cd webui && npm run build"
            git diff --stat -- suijin/ui/dist
            exit 1
          fi

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/suijin-core

      - name: Format + lint + unit tests
        run: |
          cd native/suijin-core
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --release

      - name: Python oracle comparison (pure vs compiled)
        run: |
          cd native/suijin-core && cargo build --release && cd ../..
          pip install pytest --quiet
          python -m pytest suijin/tests/kernel/test_native_oracle.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}
