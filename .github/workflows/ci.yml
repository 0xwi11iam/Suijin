name: Medusa CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug — Python version and path
        run: |
          python --version
          python -c "import sys; print('sys.path:', sys.path[:3])"
          echo "PWD: $(pwd)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r medusa/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify package imports
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -c "
          import medusa.core.state, medusa.core.agent_graph, medusa.core.supervisor, medusa.core.error_handler
          import medusa.core.blue.config, medusa.core.blue.knowledge_graph, medusa.core.blue.ai_engine
          import medusa.tools.guardrails, medusa.tools.workspace, medusa.core.blue.errors
          import medusa.core.config_models, medusa.core.constants
          print('All imports OK')
          "

      - name: Run tests with coverage
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -m pytest medusa/tests/ \
            -v --tb=short \
            --cov=medusa --cov-report=term-missing --cov-report=xml \
            -m "not ai" \
            -p no:warnings

      - name: Type check (non-blocking)
        continue-on-error: true
        run: |
          pip install pyright && pyright medusa/

      - name: Lint check
        run: |
          pip install ruff && ruff check medusa/

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit && pip-audit

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd webui
          npm ci --no-audit --no-fund
          npm run build

      - name: Committed bundle must be fresh
        run: |
          # The build just regenerated medusa/ui/dist. If git sees changes,
          # the committed bundle is stale — rebuild locally and commit it.
          if ! git diff --quiet -- medusa/ui/dist; then
            echo "::error::medusa/ui/dist is stale — run: cd webui && npm run build"
            git diff --stat -- medusa/ui/dist
            exit 1
          fi
