name: Suijin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug — Python version and path
        run: |
          python --version
          python -c "import sys; print('sys.path:', sys.path[:3])"
          echo "PWD: $(pwd)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r suijin/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Deploy scripts sanity
        run: |
          bash -n install.sh
          bash -n docker.sh
          bash -n kali-setup.sh
          # compose YAML parses + .env.example keys match compose env list exactly
          python - <<'PYEOF'
          import re
          import yaml
          compose = yaml.safe_load(open("docker-compose.yml"))
          env_list = compose["services"]["suijin"]["environment"]
          compose_keys = {m.group(1) for e in env_list for m in [re.match(r"([A-Z_]+)=", str(e))] if m}
          example_keys = set(re.findall(r"^([A-Z_]+)=", open(".env.example").read(), re.M))
          assert compose_keys == example_keys, f"env drift: {compose_keys ^ example_keys}"
          print(f"deploy sanity ok: {len(compose_keys)} env keys match, compose parses")
          PYEOF

      - name: Verify package imports
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -c "
          import suijin.modules.agent.lib.state, suijin.modules.agent.lib.agent_graph, suijin.modules.agent.lib.supervisor, suijin.modules.platform.lib.error_handler
          import suijin.modules.blueteam.lib.blue.config, suijin.modules.blueteam.lib.blue.knowledge_graph, suijin.modules.blueteam.lib.blue.ai_engine
          import suijin.modules.tools.lib.guardrails, suijin.modules.platform.lib.workspace, suijin.modules.blueteam.lib.blue.errors
          import suijin.modules.platform.lib.config_models, suijin.modules.platform.lib.constants
          print('All imports OK')
          "

      - name: Run tests with coverage
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -m pytest suijin/tests/ \
            -v --tb=short \
            --cov=suijin --cov-report=term-missing --cov-report=xml \
            -m "not ai" \
            -p no:warnings

      - name: Capability audit (no-orphan-code gate)
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -c "
          from suijin.modules.platform.lib.runtime import init_runtime
          init_runtime()
          from suijin.modules.tools.lib.capability_audit import audit
          code, report = audit()
          print(report)
          raise SystemExit(code)
          "

      - name: Type check (non-blocking)
        continue-on-error: true
        run: |
          pip install pyright && pyright suijin/

      - name: Lint check
        run: |
          pip install ruff && ruff check suijin/

      - name: Architecture boundaries (kernel purity + module boundaries)
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python -m pytest suijin/tests/kernel/test_kernel_purity.py \
            suijin/tests/kernel/test_phase5_boundary.py \
            suijin/tests/kernel/test_audit_regressions.py -q

      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit && pip-audit
