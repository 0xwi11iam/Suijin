name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  wheel-build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version sources agree (pyproject == version.json)
        run: |
          python - <<'PYEOF'
          import json, re, sys
          pj = re.search(r'^version = "(.+)"', open("pyproject.toml").read(), re.M).group(1)
          vj = json.load(open("suijin/version.json"))["version"]
          if pj != vj:
              sys.exit(f"VERSION DRIFT: pyproject={pj} version.json={vj} — sync them before tagging")
          print(f"version sources agree: {pj}")
          PYEOF

      - name: Build and check the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel in a clean env (resolution proof)
        # 5.6.0 shipped an unsatisfiable pair (rich<14 + textual>=8 which
        # needs rich>=14.2) — pip only fails like that in a FRESH env; the
        # dev venv had compatible-but-out-of-bounds versions already
        # installed, so every local gate passed. Prove it pre-release.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/suijin-*.whl
          /tmp/smoke/bin/suijin version

  pypi-publish:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheel-build]  # the clean-venv install proof gates the upload (5.6.0 lesson)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (no token if configured) — falls back to the secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Check name availability (clear error, not a mystery 400)
        run: |
          python - <<'PYEOF'
          import tomllib
          import urllib.request
          data = tomllib.loads(open("pyproject.toml").read())
          name = data["project"]["name"]
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json", timeout=10)
              print(f"NOTE: '{name}' already exists on PyPI — this upload must be from the same owner or it will be rejected")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f"'{name}' is free on PyPI")
              else:
                  print(f"PyPI check returned {e.code} (non-fatal, continuing)")
          PYEOF

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
        continue-on-error: false

  github-release:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [pypi-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Find the release notes for this version
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" /tmp/release_body.md
          else
            echo "Release v${VERSION}" > /tmp/release_body.md
          fi

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_body.md
          generate_release_notes: false
