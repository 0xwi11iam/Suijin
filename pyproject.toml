[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suijin"
version = "5.3.0"
description = "Suijin — autonomous red & blue teaming (formerly Medusa)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "William Jiang" }]
keywords = ["security", "pentesting", "red-team", "blue-team", "agent", "llm"]
# Full toolset (module packs under Modules/) requires a repo checkout —
# see README "Packaging". The wheel ships every core tool.
dependencies = [
    "requests>=2.28,<3.0",
    "rich>=13.0,<14.0",
    "huggingface_hub>=0.20,<1.0",
    "psutil>=5.9,<6.0",
    "pydantic>=2.0,<3.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint>=2.0,<3.0",
    "flask>=2.3,<4.0",
    "flask_cors>=4.0,<5.0",
    "PyJWT>=2.8,<3.0",
    "duckduckgo-search>=6.0",
    "textual>=8.0,<9.0",  # Module Manager TUI (Phase 4)
    "urllib3>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/0xwi11iam/Suijin"

[project.scripts]
suijin = "suijin.modules.console.lib.cli:main"

[tool.setuptools.packages.find]
include = ["suijin*"]
exclude = ["suijin.tests*", "webui*"]

[tool.setuptools.package-data]
# Non-Python assets the runtime reads — a wheel without these is broken.
suijin = [
    "version.json",
    "marketplace_index.json",
    "modules/agent/lib/prompts/*.py",
    "modules/agent/lib/skills/*.py",
    "modules/*/plugin.json",
    "modules/*/manifest.json",
    "modules/*/skill.md",
    "skills/*.md",
    "skills/README.md",
    "addons/README.md",
]

[tool.pytest.ini_options]
testpaths = ["suijin/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ai: marks tests that need live API keys (deselect with '-m \"not ai\"')",
    "integration: marks integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["suijin"]
omit = ["suijin/lab/*", "suijin/tests/*", "suijin_agent/*", "suijin/modules/*/main.py", "suijin/modules/*/entry.py"]

[tool.coverage.report]
fail_under = 56
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["suijin/lab/", "suijin_agent/", "__pycache__/", ".git/"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "I"]
# E401/E701/E702 — the codebase deliberately uses compact one-line imports
#   and statements; enforcing the expansion would churn every file.
# E402 — entry-point scripts (cli.py, main.py) must import AFTER inserting
#   the repo root into sys.path, so not-at-top imports are intentional there.
ignore = ["E501", "B904", "B007", "E401", "E701", "E702", "E402"]

[tool.ruff.lint.per-file-ignores]
# Vendored third-party pack implementations (manifest.json = pack marker)
"suijin/modules/*/main.py" = ["E", "F", "W", "B", "SIM", "I"]
# Package __init__ files re-export via star imports by design.
"**/__init__.py" = ["F403", "F401", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["suijin/lab/", "suijin_agent/", "__pycache__/"]
reportMissingImports = false
reportOptionalMemberAccess = false
