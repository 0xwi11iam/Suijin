[package]
name = "suijin-core"
version = "0.1.0"
edition = "2021"
description = "Suijin kernel compiled core — DAG resolution and VFS path checks (the two pure data-in/data-out functions). Pure-Python oracles ship alongside; this crate is the accelerated twin."
license = "MIT"

[lib]
name = "suijin_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
