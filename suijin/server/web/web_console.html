<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>suijin</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2129; --border: #30363d;
  --text: #e6edf3; --dim: #8b949e; --green: #3fb950; --gold: #d29922;
  --cyan: #58a6ff; --red: #f85149; --purple: #bc8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,'Inter',system-ui,sans-serif;overflow:hidden}

/* ── top strip ── */
.strip{display:flex;align-items:center;gap:16px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.strip .logo{color:var(--gold);font-weight:700;font-size:15px}
.strip .m{color:var(--dim);font-size:13px}
.strip .m b{color:var(--text);font-weight:600}
.strip .sep{color:var(--border);margin:0 -4px}
.strip .spacer{flex:1}
.strip .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.5}}

/* ── layout ── */
#layout{display:flex;height:calc(100vh - 36px)}

/* left: agent list */
#sidebar{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column}
#sidebar h3{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 16px 8px}
.agent-card{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.agent-card:hover{background:var(--surface)}
.agent-card.selected{background:var(--surface2);border-left:2px solid var(--cyan)}
.agent-card .id{font-weight:600;font-size:13px;color:var(--cyan)}
.agent-card .lane{color:var(--dim);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-card .meta{display:flex;gap:8px;margin-top:4px;font-size:11px;color:var(--dim)}
.agent-card .badge{padding:0 5px;border-radius:2px;font-size:10px}
.badge-box{color:var(--gold);border:1px solid var(--gold)}
.badge-host{color:var(--dim);border:1px solid var(--dim)}
.pile-section{padding:10px 16px;margin-top:auto;border-top:1px solid var(--border)}
.pile-section .count{font-size:12px;color:var(--dim)}

/* center: detail stream */
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#detail-header{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
#detail-header .id{color:var(--text);font-weight:600;font-size:14px}
#detail-header .mission{color:var(--dim);font-size:12px;margin-top:2px}
#detail-stream{flex:1;overflow-y:auto;padding:12px 16px}

/* turn blocks */
.turn{margin-bottom:14px;border-radius:6px;overflow:hidden;background:var(--surface)}
.turn .thought{padding:6px 12px;color:var(--dim);font-size:12px;font-style:italic;border-left:2px solid var(--cyan);margin-bottom:4px}
.turn .tool{padding:4px 12px;color:var(--green);font-weight:600;font-size:13px;font-family:monospace}
.turn .args{padding:2px 12px 6px;color:var(--dim);font-size:11px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:60px;overflow:hidden}
.turn .obs{padding:6px 12px;color:var(--text);font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow-y:auto;border-top:1px solid var(--border)}
.turn .obs.confirmed{color:var(--gold)}
.turn.confirmed{border-left:2px solid var(--gold)}
.turn .ts{color:var(--dim);font-size:10px;padding:0 12px}

/* findings */
#findings-panel{width:280px;border-left:1px solid var(--border);display:flex;flex-direction:column}
#findings-panel h3{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 16px 8px}
.finding{padding:8px 14px;border-bottom:1px solid var(--border)}
.finding .sev{font-weight:700;font-size:12px;text-transform:uppercase}
.finding .sev.high,.finding .sev.critical{color:var(--red)}
.finding .sev.medium{color:var(--gold)}
.finding .sev.low{color:var(--cyan)}
.finding .title{font-size:12px;color:var(--text);margin-top:2px}
.finding .status{font-size:10px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.status.reported{color:var(--gold)}
.status.verified{color:var(--green)}
.status.false_positive{color:var(--red)}
.status.duplicate{color:var(--dim)}

/* bottom: mesh chat + input */
#bottom{border-top:1px solid var(--border);padding:8px 14px;background:var(--surface)}
#bottom h3{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
#mesh-feed{max-height:120px;overflow-y:auto;margin-bottom:8px}
.chat-line{font-size:12px;margin-bottom:4px}
.chat-line .who{color:var(--purple);font-weight:600}
.chat-line .msg{color:var(--text)}
#say{display:flex;gap:6px}
#say input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:5px;font:inherit;font-size:12px;outline:none}
#say input:focus{border-color:var(--cyan)}
#say button{background:var(--gold);color:var(--bg);border:none;padding:6px 12px;border-radius:4px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="strip">
  <span class="logo">suijin</span>
  <span class="sep">│</span>
  <span class="m">agents <b id="n-agents">0</b></span>
  <span class="sep">│</span>
  <span class="m">boxed <b id="n-boxed">0</b></span>
  <span class="sep">│</span>
  <span class="m">host <b id="n-host">0</b></span>
  <span class="sep">│</span>
  <span class="m">remote <b id="n-remote">0</b></span>
  <span class="sep">│</span>
  <span class="m">findings <b id="n-findings">0</b></span>
  <span class="spacer"></span>
  <span class="m">spend <b id="n-spend">$0.00</b></span>
  <span class="pulse"></span>
</div>

<div id="layout">
  <div id="sidebar">
    <h3>agents</h3>
    <div id="agent-list"></div>
    <div class="pile-section">
      <div class="count" id="pile-count">warm pile: 0</div>
    </div>
  </div>

  <div id="center">
    <div id="detail-header">
      <div class="id" id="d-id">select an agent</div>
      <div class="mission" id="d-mission"></div>
    </div>
    <div id="detail-stream"></div>
  </div>

  <div id="findings-panel">
    <h3>findings — honest board</h3>
    <div id="finding-list"></div>
  </div>
</div>

<div id="bottom">
  <h3>mesh</h3>
  <div id="mesh-feed"></div>
  <div id="say">
    <input id="msg" placeholder="speak to the mesh…" autocomplete="off">
    <button onclick="say()">say</button>
  </div>
</div>

<script>
// ── state ──
let data = {swarm:{agents:[],findings:[],live:false}, sessions:{sessions:[]}};
let selected = null;
const $ = id => document.getElementById(id);

// ── fetch + render ──
async function refresh() {
  try {
    const r = await fetch('/api/state');
    data = await r.json();
    renderStrip(); renderAgents(); renderFindings();
    if (selected) renderDetail(selected);
  } catch(e) {}
}

function renderStrip() {
  const sw = data.swarm || {};
  const agents = sw.agents || [];
  const live = agents.filter(a => !a.dead);
  const boxed = agents.filter(a => a.boxed);
  $('n-agents').textContent = agents.length;
  $('n-boxed').textContent = boxed.length;
  $('n-host').textContent = agents.length - boxed.length;
  $('n-remote').textContent = 0;
  const findings = sw.findings || [];
  $('n-findings').textContent = findings.length;
}

function renderAgents() {
  const sw = data.swarm || {};
  const agents = sw.agents || [];
  const list = $('agent-list');
  list.innerHTML = '';
  for (const a of agents) {
    const cls = a.boxed ? 'box' : 'host';
    const card = document.createElement('div');
    card.className = 'agent-card' + (selected === a.id ? ' selected' : '');
    card.onclick = () => { selected = a.id; renderAgents(); renderDetail(a.id); };
    card.innerHTML = `
      <div class="id">${a.id}</div>
      <div class="lane">${a.lane || 'idle'}</div>
      <div class="meta"><span class="badge ${cls}">${cls}</span><span>${a.hb_age || 0}s</span></div>`;
    list.appendChild(card);
  }
}

function renderDetail(aid) {
  const el = $('detail-stream');
  const turns = (window._eventsByAgent || {})[aid] || [];
  el.innerHTML = turns.map(t => `
    <div class="turn${t.obs && t.obs.includes('CONFIRMED') ? ' confirmed' : ''}">
      ${t.thought ? `<div class="thought">${t.thought}</div>` : ''}
      <div class="tool">❯ ${t.tool}</div>
      ${t.args ? `<div class="args">${t.args}</div>` : ''}
      ${t.obs ? `<div class="obs">${t.obs}</div>` : ''}
      <div class="ts">${t.ts || ''}</div>
    </div>`).join('') || '<div style="color:var(--dim);padding:20px">no events</div>';
  el.scrollTop = el.scrollHeight;
}

function renderFindings() {
  const fl = $('finding-list');
  const findings = (data.swarm || {}).findings || [];
  if (!findings.length) { fl.innerHTML = '<div style="color:var(--dim);padding:8px">none</div>'; return; }
  fl.innerHTML = findings.map(f => `
    <div class="finding">
      <div class="sev ${f.severity}">${f.severity}</div>
      <div class="title">${f.title}</div>
      <div class="status">${f.status || ''}</div>
    </div>`).join('');
}

// ── detail from events ──
window._eventsByAgent = {};
function setEvents(agent, events) {
  window._eventsByAgent[agent] = events;
  if (selected === agent) renderDetail(agent);
}

// ── live fetch loop ──
async function poll() {
  try {
    const r = await fetch('/api/state');
    const d = await r.json();
    renderStrip(); renderAgents(); renderFindings();
    if (selected) renderDetail(selected);
  } catch(e) {}
}
setInterval(poll, 3000);

// ── say ──
async function say() {
  const msg = $('msg').value.trim();
  if (!msg) return;
  $('msg').value = '';
  try {
    await fetch('/api/say', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({msg})});
  } catch(e) {}
  addChatLine({from:'operator', msg});
}
function addChatLine(p) {
  const feed = $('mesh-feed');
  const d = document.createElement('div');
  d.className = 'chat-line';
  d.innerHTML = `<span class="who">${p.from || 'peer'}:</span> <span class="msg">${p.msg || ''}</span>`;
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
  while (feed.children.length > 30) feed.removeChild(feed.firstChild);
}

$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') say(); });

// boot
refresh(); poll();
setInterval(poll, 3000);
</script>
</body>
</html>
