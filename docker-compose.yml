# Suijin Security — Docker Compose
# Usage:
#   docker compose build
#   docker compose run --rm suijin
#   Or with env: DEEPSEEK_API_KEY=sk-xxx docker compose run --rm suijin

services:
  suijin:
    build: .
    image: suijin:latest
    container_name: suijin-agent
    stdin_open: true
    tty: true
    volumes:
      - ./suijin_agent:/app/suijin_agent
      - ./suijin/config.json:/app/suijin/config.json
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AMD_API_KEY=${AMD_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_SECRET=${CENSYS_SECRET:-}
      - VT_API_KEY=${VT_API_KEY:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
    networks:
      - suijin-net

networks:
  suijin-net:
    driver: bridge
