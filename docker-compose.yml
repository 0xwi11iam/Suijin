# Suijin Security — Docker Compose
#
# One command, full stack:
#   docker compose run --rm suijin                    # interactive agent
#   DEEPSEEP_KEY set? pass env via .env or the environment list below
#
# Profiles:
#   (default)  the agent + full Kali toolset + workspace volume
#   --profile tools  adds nothing yet — reserved for split tool services
#
# The named volume `workspace` is THE state: outputs, the knowledge base,
# caches, operator configs. `docker compose down` never loses it;
# `docker compose down -v` wipes it deliberately.

services:
  suijin:
    build: .
    # GHCR-published image — compose pulls this when it exists (no local
    # build needed after a plain clone); `build: .` still wins for local dev
    image: ghcr.io/0xwi11iam/suijin:latest
    container_name: suijin-agent
    stdin_open: true
    tty: true
    init: true
    restart: "no"
    env_file:
      - path: .env
        required: false
    volumes:
      - workspace:/app/suijin_agent
      - ./suijin/config.json:/app/suijin/config.json:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_SECRET=${CENSYS_SECRET:-}
      - VT_API_KEY=${VT_API_KEY:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - SUIJIN_DOCKER=1
    healthcheck:
      test: ["CMD", "python3", "/app/suijin/modules/console/lib/cli.py", "doctor"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 30s

volumes:
  workspace:
    name: suijin_workspace
